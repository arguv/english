<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, notranslate, noimageindex">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Happy Word Game</title>
    <link rel="stylesheet" href="style.css"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png">
</head>
<body>

<!-- TOP MENU -->
<div id="top-menu">
    <select id="category-select"></select>
    <select id="type-select"></select>
    <button id="refresh-session">🔄 <span id="refresh-text">Refresh Session</span></button>
</div>

<!-- IMAGE -->
<div id="image-container">
    <img id="word-image" alt="Word Image">
</div>

<!-- CARD -->
<div class="card" id="card">
    <img id="mascot" src="mascot.png" alt="Mascot"/>
    <div id="word">👋 Tap or press SPACE</div>
</div>

<!-- FOOTER -->
<div id="footer">
    <button id="show-img-btn" disabled>🖼️</button>
    <span id="progress"></span>
    <button id="speak-btn">🔊</button>
</div>

<script src="script.js"></script>
</body>
</html>
